<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<!-- Навигационное меню -->
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard">Складской учёт</a>
        <div class="ms-auto">
                <span class="navbar-text me-3" sec:authorize="isAuthenticated()">
                    Привет, <span sec:authentication="name"></span>!
                </span>
            <a class="btn btn-outline-danger" href="/logout">Выход</a>
        </div>
    </div>
</nav>

<!-- Основное содержимое -->
<div class="container mt-5 text-center">
    <h1>Добро пожаловать в систему складского учёта</h1>
    <div class="mt-4">
        <a class="btn btn-primary btn-lg m-2" href="/products">Товары</a>
        <a class="btn btn-primary btn-lg m-2" href="/inventory">Склад</a>
        <a class="btn btn-primary btn-lg m-2" href="/costing">Юнит-экономика</a>
    </div>
</div>

<!-- Дополнительное содержимое -->
<div class="container mt-5">
    <div class="row">
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Обзор запасов</h5>
                    <p class="card-text">Всего товаров: <span th:text="${totalItems ?: '0'}"></span></p>
                    <p class="card-text">Низкий запас: <span th:text="${lowStockItems ?: '0'}"></span></p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Финансовый отчёт</h5>
                    <p class="card-text">Общая выручка: <span th:text="${totalRevenue ?: '0'}"></span> руб.</p>
                    <p class="card-text">Средняя маржа: <span th:text="${averageMargin ?: '0'}"></span>%</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Последние действия</h5>
                    <p class="card-text">Добавлен товар: Товар А</p>
                    <p class="card-text">Обновлён склад: 10.05.2025</p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
