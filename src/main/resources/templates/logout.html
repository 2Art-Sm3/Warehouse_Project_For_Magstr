<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="text-center">
<main class="w-100 m-auto" style="max-width: 330px; padding: 15px;">
    <h1 class="h3 mb-3 fw-normal">Are you sure you want to log out?</h1>
    <form th:action="@{/logout}" method="post">
        <button class="btn btn-lg btn-danger" type="submit">Log out</button>
        <a th:href="@{/dashboard}" class="btn btn-lg btn-secondary">Cancel</a>
    </form>
</main>
</body>
</html>
