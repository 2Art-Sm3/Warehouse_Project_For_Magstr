<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Добавить товар</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-3">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4>Складской учет</h4>
        <div>
            <span class="me-3">Привет, <span th:text="${#authentication.name} ?: 'Гость'"></span></span>
            <a href="/logout" class="btn btn-outline-danger btn-sm">Выход</a>
        </div>
    </div>
    <h2>Добавить товар</h2>
    <form th:action="@{/products/add}" th:object="${product}" method="post">
        <div class="mb-3">
            <label for="sku" class="form-label">Артикул</label>
            <input type="text" class="form-control" id="sku" th:field="*{sku}" required>
        </div>
        <div class="mb-3">
            <label for="name" class="form-label">Наименование</label>
            <input type="text" class="form-control" id="name" th:field="*{name}" required>
        </div>
        <div class="mb-3">
            <label for="color" class="form-label">Цвет</label>
            <input type="text" class="form-control" id="color" th:field="*{color}">
        </div>
        <div class="mb-3">
            <label for="price" class="form-label">Цена</label>
            <input type="number" step="0.01" class="form-control" id="price" th:field="*{price}" required>
        </div>
        <div class="mb-3">
            <label for="quantityInStock" class="form-label">Количество на складе</label>
            <input type="number" class="form-control" id="quantityInStock" th:field="*{quantityInStock}">
        </div>
        <button type="submit" class="btn btn-primary">Добавить</button>
        <a href="/products/manage" class="btn btn-secondary ms-2">Отмена</a>
    </form>
</div>
</body>
</html>
