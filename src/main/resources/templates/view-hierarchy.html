<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>View Hierarchy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-3">
    <h1>Иерархия для <span th:text="${product.name}"></span></h1>

    <div th:if="${existingHierarchy != null and !existingHierarchy.isEmpty}">
        <table class="table table-bordered">
            <thead>
            <tr>
                <th>Компонент</th>
                <th>Количество</th>
                <th>Файл</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="hierarchy : ${existingHierarchy}">
                <td th:text="${hierarchy.component.name}"></td>
                <td th:text="${hierarchy.requiredQuantity}"></td>
                <td th:text="${hierarchy.attachedFilePath} ?: 'Нет файла'"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <div th:unless="${existingHierarchy != null and !existingHierarchy.isEmpty}">
        <p>Иерархия не создана.</p>
    </div>

    <a th:href="@{/products/manage}" class="btn btn-secondary">Назад</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
