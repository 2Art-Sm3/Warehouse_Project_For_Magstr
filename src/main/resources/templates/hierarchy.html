<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Hierarchy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-3">
    <h1>Иерархия для <span th:text="${product.name}"></span></h1>

    <!-- Отображение существующей иерархии -->
    <div th:if="${existingHierarchy != null and !existingHierarchy.isEmpty}">
        <h3>Текущая иерархия</h3>
        <table class="table table-bordered">
            <thead>
            <tr>
                <th>Компонент</th>
                <th>Количество</th>
                <th>Файл</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="hierarchy : ${existingHierarchy}">
                <td th:text="${hierarchy.component.name}"></td>
                <td th:text="${hierarchy.requiredQuantity}"></td>
                <td th:text="${hierarchy.attachedFilePath} ?: 'Нет файла'"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Форма для создания/редактирования иерархии -->
    <h3 th:if="${existingHierarchy == null or existingHierarchy.isEmpty}">Создать иерархию</h3>
    <h3 th:unless="${existingHierarchy == null or existingHierarchy.isEmpty}">Редактировать иерархию</h3>
    <form th:action="@{/hierarchy/create}" method="post">
        <input type="hidden" name="productId" th:value="${product.id}"/>
        <div class="mb-3" th:each="component : ${components}" th:with="index=${#stat.count - 1}">
            <div class="form-check">
                <input type="checkbox" class="form-check-input" th:id="'component' + ${index}" th:name="componentIds[${index}]" th:value="${component.id}"/>
                <label class="form-check-label" th:for="'component' + ${index}" th:text="${component.name}"></label>
            </div>
            <div class="mb-2">
                <label th:for="'quantity' + ${index}">Количество:</label>
                <input type="number" th:id="'quantity' + ${index}" th:name="quantities[${index}]" min="1" class="form-control"/>
            </div>
            <div class="mb-2">
                <label th:for="'filePath' + ${index}">Файл:</label>
                <input type="text" th:id="'filePath' + ${index}" th:name="filePaths[${index}]" placeholder="Путь к файлу" class="form-control"/>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a th:href="@{/products/manage}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
